name: LinkedIn Roles 24-44

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      auto_continue:
        description: 'Automatically resume unfinished states/JDs; pauses after three attempts without progress'
        type: boolean
        default: true
      previous_remaining:
        description: 'Internal continuation progress counter; leave blank'
        type: string
        default: ''
      continuation_stalls:
        description: 'Internal continuation retry counter; leave blank'
        type: string
        default: ''
      resume_run_id:
        description: "Continue an earlier run ID while preserving its saved jobs"
        required: false
        default: ""
        type: string
      state_split_mode:
        description: "auto: split capped nationwide searches by US state; all: always search every US state"
        required: false
        default: all
        type: choice
        options: [all, auto]
      post_time:
        description: "How far back to look for jobs"
        required: false
        default: week
        type: choice
        options: [day, week, 3week, month, any]
      roles:
        description: "Comma-separated filters within roles 24-44; blank runs the whole range."
        required: false
        default: "Head of Procurement, Procurement Officer, Procurement Coordinator, Procurement Engineer, Procurement Assistant, Sourcing Manager, Sourcing Specialist, Strategic Sourcing Manager, Senior Manager Strategic Sourcing, Senior Sourcing Analyst, Senior Sourcing Manager, Senior Sourcing Specialist, Assistant Sourcing Manager, Global Sourcing Lead, Senior Manager Global Sourcing, Strategic Sourcing Specialist, Sourcing Lead, Senior Buyer, Purchasing Manager, Purchasing Representative, Procurement Buyer"
        type: string
      shards:
        description: "Maximum simultaneous task runners"
        required: false
        default: "8"
        type: choice
        options: ["4", "8", "12", "16"]

jobs:
  scrape:
    uses: ./.github/workflows/linkedin_roles_slice.yml
    with:
      resume_run_id: ${{ inputs.resume_run_id }}
      role_start: 24
      role_end: 44
      state_split_mode: ${{ inputs.state_split_mode || 'all' }}
      post_time: ${{ inputs.post_time || 'week' }}
      roles: ${{ inputs.roles }}
      shards: ${{ inputs.shards || '8' }}
    secrets: inherit
